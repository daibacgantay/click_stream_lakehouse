name: clickstream-lakehouse

services:

  # ════════════════════════════════════════════════════════════
  # STORAGE LAYER
  # ════════════════════════════════════════════════════════════

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lakehouse

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lakehouse

  # Tạo bucket trong MinIO lần đầu khởi động — chạy xong tự thoát
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/lakehouse &&
      mc mb --ignore-existing local/lakehouse/bronze &&
      mc mb --ignore-existing local/lakehouse/silver &&
      mc mb --ignore-existing local/lakehouse/gold &&
      mc mb --ignore-existing local/lakehouse/spark-logs &&
      echo '>>> MinIO buckets ready.'
      "
    networks:
      - lakehouse

  # ════════════════════════════════════════════════════════════
  # METADATA CATALOG
  # ════════════════════════════════════════════════════════════

  hive-metastore:
    build:
      context: ./docker/hive
      dockerfile: Dockerfile
    image: lakehouse/hive:4.0.0
    container_name: hive-metastore
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
        -Djavax.jdo.option.ConnectionUserName=${POSTGRES_USER}
        -Djavax.jdo.option.ConnectionPassword=${POSTGRES_PASSWORD}
    ports:
      - "9083:9083"
    volumes:
      - ./docker/hive/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9083' 2>/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks:
      - lakehouse

  # ════════════════════════════════════════════════════════════
  # COMPUTE LAYER — Spark Cluster (1 Master + 2 Workers)
  # ════════════════════════════════════════════════════════════

  spark-master:
    build:
      context: ./docker/spark
      dockerfile: Dockerfile
    image: lakehouse/spark:3.5.8
    container_name: spark-master
    command: master
    environment:
      SPARK_MASTER_HOST: spark-master
    ports:
      - "8080:8080"   # Spark Master Web UI
      - "7077:7077"   # Spark cluster port
    volumes:
      - ./ingestion:/opt/spark/jobs:ro
      - ./data:/opt/spark/data:ro
      - ./docker/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    networks:
      - lakehouse

  spark-worker-1:
    build:
      context: ./docker/spark
      dockerfile: Dockerfile
    image: lakehouse/spark:3.5.8
    container_name: spark-worker-1
    command: worker spark://spark-master:7077
    depends_on:
      - spark-master
    environment:
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY}
    volumes:
      - ./ingestion:/opt/spark/jobs:ro
      - ./data:/opt/spark/data:ro
      - ./docker/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    networks:
      - lakehouse

  spark-worker-2:
    build:
      context: ./docker/spark
      dockerfile: Dockerfile
    image: lakehouse/spark:3.5.8
    container_name: spark-worker-2
    command: worker spark://spark-master:7077
    depends_on:
      - spark-master
    environment:
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY}
    volumes:
      - ./ingestion:/opt/spark/jobs:ro
      - ./data:/opt/spark/data:ro
      - ./docker/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    networks:
      - lakehouse

  spark-history-server:
    build:
      context: ./docker/spark
      dockerfile: Dockerfile
    image: lakehouse/spark:3.5.8
    container_name: spark-history-server
    command: history-server
    depends_on:
      - spark-master
      - minio-init
    ports:
      - "18080:18080"   # History Server UI — xem performance job đã chạy xong
    volumes:
      - ./docker/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    networks:
      - lakehouse

  # ════════════════════════════════════════════════════════════
  # ORCHESTRATION — Apache Airflow
  # ════════════════════════════════════════════════════════════

  # Chạy một lần: migrate DB schema + tạo admin user
  airflow-init:
    build:
      context: ./docker/airflow
      dockerfile: Dockerfile
    image: lakehouse/airflow:3.0
    container_name: airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres:5432/${AIRFLOW_DB_NAME}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    entrypoint: /bin/bash
    command: >
      -c "
      airflow db migrate &&
      airflow users create
        --username ${AIRFLOW_ADMIN_USER}
        --password ${AIRFLOW_ADMIN_PASSWORD}
        --firstname Admin --lastname User
        --role Admin --email admin@lakehouse.local || true
      "
    networks:
      - lakehouse

  airflow-webserver:
    build:
      context: ./docker/airflow
      dockerfile: Dockerfile
    image: lakehouse/airflow:3.0
    container_name: airflow-webserver
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres:5432/${AIRFLOW_DB_NAME}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      SPARK_MASTER_URL: ${SPARK_MASTER_URL}
    command: webserver
    ports:
      - "8081:8080"   # Airflow Web UI
    volumes:
      - ./dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - lakehouse

  airflow-scheduler:
    build:
      context: ./docker/airflow
      dockerfile: Dockerfile
    image: lakehouse/airflow:3.0
    container_name: airflow-scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres:5432/${AIRFLOW_DB_NAME}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
      SPARK_MASTER_URL: ${SPARK_MASTER_URL}
    command: scheduler
    volumes:
      - ./dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    networks:
      - lakehouse

  # ════════════════════════════════════════════════════════════
  # QUERY ENGINE — Trino
  # ════════════════════════════════════════════════════════════

  trino:
    image: trinodb/trino:438
    container_name: trino
    depends_on:
      hive-metastore:
        condition: service_healthy
    ports:
      - "8082:8080"   # Trino UI + JDBC
    volumes:
      - ./docker/trino/etc:/etc/trino:ro
    networks:
      - lakehouse

# ════════════════════════════════════════════════════════════
# NETWORKS & VOLUMES
# ════════════════════════════════════════════════════════════

networks:
  lakehouse:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  airflow_logs:
